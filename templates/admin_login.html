<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suscripciones · Acceso</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #2a1b5e, #0b0b14 60%);
      color: #f4f4f8;
    }
    .card {
      width: min(92vw, 380px); padding: 28px; border-radius: 18px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: #b9b9c9; font-size: 13px; margin: 0 0 20px; }
    label { display: block; font-size: 12px; color: #b9b9c9; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25);
      color: #fff; font-size: 15px;
    }
    button {
      margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 10px;
      background: linear-gradient(135deg, #6c4df4, #0f766e); color: #fff;
      font-weight: 600; font-size: 15px; cursor: pointer;
    }
    .error {
      margin-top: 14px; padding: 10px 12px; border-radius: 10px;
      background: rgba(239,68,68,.16); color: #fca5a5; font-size: 13px;
    }
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>Suscripciones</h1>
    <p>Panel de control de acceso a códigos.</p>
    <label for="password">Contraseña de administración</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">Entrar</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
